    <script>
      // Applied before first paint so a stored theme never flashes the default.
      (function () {
        try {
          var valid = ["aurora", "editorial", "neon", "maison"];
          var query = new URLSearchParams(location.search).get("theme");
          var stored = localStorage.getItem("kj-theme");
          var picked =
            valid.indexOf(query) !== -1
              ? query
              : valid.indexOf(stored) !== -1
                ? stored
                : "maison";
          document.documentElement.dataset.theme = picked;
        } catch (e) {
          document.documentElement.dataset.theme = "maison";
        }
      })();
    </script>
